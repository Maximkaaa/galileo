[workspace]
members = [
    "galileo",
    "galileo-maplibre",
    "galileo-mvt",
    "galileo-types",
    "galileo-egui",
    "web-example",
]
resolver = "2"

exclude = [
    "android_examples/raster_tiles/rust",
]

[profile.release]
debug = true

[workspace.package]
authors = ["Maxim Gritsenko <maxim@gritsenko.biz>"]
categories = ["science::geo"]
edition = "2024"
keywords = ["gis", "map", "rendering"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Maximkaaa/galileo"
version = "0.2.1"

[workspace.lints]
rust.missing_docs = "warn"
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(wasm_bindgen_unstable_test_coverage)',
] }
clippy.unwrap_used = "warn"

[workspace.dependencies]
ahash = "0.8"
anyhow = "1"
approx = "0.5"
async-trait = "0.1"
base64 = "0.21"
bincode = "2.0.0-rc.3"
csscolorparser = "0.8"
bitcode = "0.6"
bytemuck = "1.14"
bytes = "1.4"
cfg-if = "1"
chumsky = "0.12"
console_log = "1"
console_error_panic_hook = "0.1"
csv = "1.3"
egui = "0.34"
egui-wgpu = "0.34"
eframe = { version = "0.34", default-features = false }
either = "1"
env_logger = "0.11"
fontdb = { version = "0.23", default-features = false }
font-kit = "0.14"
font-query = { git = "https://github.com/Maximkaaa/font-query" }
futures = "0.3"
futures-intrusive = "0.5"
galileo = { path = "galileo", version = "0.2.1", default-features = false }
galileo-egui = { path = "galileo-egui", version = "0.2.1" }
galileo-mvt = { path = "galileo-mvt", version = "0.2.1" }
galileo-types = { path = "galileo-types", version = "0.2.1" }
geodesy = "0.13"
geojson = "0.24"
geozero = { version = "0.13", default-features = false }
geo-types = "0.7"
getrandom = "0.3"
image = { version = "0.24", default-features = false }
insta = "1.41"
itertools = "0.14"
js-sys = "0.3"
las = "0.8"
log = "0.4"
lyon = "1"
maybe-sync = "0.1"
nalgebra = "0.32"
num-traits = "0.2"
ordered-float = "5"
ordered_hash_map = "0.5"
parking_lot = "0.12"
prost = "0.12"
prost-build = "0.12"
quick_cache = "0.4"
raw-window-handle = "0.6"
regex = "1.11"
reqwest = { version = "0.13", default-features = false }
rustybuzz = "0.20"
serde = "1"
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
serde_ignored = "0.1"
serde_json = "1"
strfmt = "0.2"
thiserror = "1"
tokio = { version = "1.45", default-features = false }
tokio-test = "0.4"
# Fix the version of uuid to prevent build breaking
uuid = "1.17"
wasm-bindgen = "0.2"
wasm-bindgen-derive = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"
web-sys = "0.3, <0.3.92"
wgpu = { git = "https://github.com/gfx-rs/wgpu.git", rev = "014d9e84813a2946febfa4888694c0b70565b2f5", default-features = false, features = ["metal", "wgsl", "webgl", "vulkan", "gles"] }
winit = { version = "0.30", default-features = false }
